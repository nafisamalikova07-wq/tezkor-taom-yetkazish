<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mazali Restoran</title>
  
  <!-- React, ReactDOM va Babel (JSX ni tushunish uchun) kutubxonalari -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React kodi (type="text/babel" bo'lishi shart) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const menuItems = [
      // Ovqatlar
      { id: 1, name: "Osh", price: 25000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=500&q=80" },
      { id: 2, name: "Shashlik", price: 18000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&q=80" },
      { id: 3, name: "Manti", price: 22000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1626776876729-bab4369a5a5a?w=500&q=80" },
      { id: 4, name: "Lag'mon", price: 28000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&q=80" },
      { id: 11, name: "Kabob", price: 30000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1544025162-d76694265947?w=500&q=80" },
      { id: 12, name: "Dimlama", price: 26000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=500&q=80" },
      { id: 13, name: "Tandir Somsa", price: 15000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?w=500&q=80" },
      { id: 14, name: "Sho'rva", price: 20000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1547592180-85f173990554?w=500&q=80" },
      { id: 15, name: "Norin", price: 32000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1552611052-33e04de081de?w=500&q=80" },
      { id: 16, name: "Qozon Kabob", price: 38000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?w=500&q=80" },
      { id: 17, name: "Xonim", price: 20000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=500&q=80" },
      { id: 18, name: "Chuchvara", price: 22000, category: "Ovqatlar", image: "https://images.unsplash.com/photo-1583032015879-e5022cb87c3b?w=500&q=80" },

      // Salatlar
      { id: 5, name: "Sezar Salati", price: 28000, category: "Salatlar", image: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=500&q=80" },
      { id: 6, name: "Achichuk", price: 12000, category: "Salatlar", image: "https://images.unsplash.com/photo-1592417817098-8fd3d9eb14a5?w=500&q=80" },
      { id: 19, name: "Bahor Salati", price: 18000, category: "Salatlar", image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500&q=80" },
      { id: 20, name: "Olivye", price: 20000, category: "Salatlar", image: "https://images.unsplash.com/photo-1623428187969-5da2dcea5ebf?w=500&q=80" },
      { id: 21, name: "Smak Salati", price: 16000, category: "Salatlar", image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&q=80" },
      { id: 22, name: "Suzma", price: 10000, category: "Salatlar", image: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500&q=80" },

      // Ichimliklar
      { id: 7, name: "Coca-Cola 1L", price: 14000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500&q=80" },
      { id: 8, name: "Ko'k choy", price: 8000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1627435601361-ec25f5b1d0e5?w=500&q=80" },
      { id: 23, name: "Fanta 1.5L", price: 16000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1624517452488-04869289c4ca?w=500&q=80" },
      { id: 24, name: "Qora choy", price: 8000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=500&q=80" },
      { id: 25, name: "Ayron", price: 10000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1556881286-fc6915169721?w=500&q=80" },
      { id: 26, name: "Limonli choy", price: 12000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=500&q=80" },
      { id: 27, name: "Tabiiy sharbat", price: 15000, category: "Ichimliklar", image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=500&q=80" },

      // Shirinliklar
      { id: 9, name: "Asalli Tort", price: 20000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500&q=80" },
      { id: 10, name: "Muzqaymoq", price: 15000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=500&q=80" },
      { id: 28, name: "Paxlava", price: 25000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1519676867240-f03562e64548?w=500&q=80" },
      { id: 29, name: "Chaq-chaq", price: 18000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=500&q=80" },
      { id: 30, name: "Mevalar To'plami", price: 22000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=500&q=80" },
      { id: 31, name: "Shakarli Somsa", price: 12000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&q=80" },
      { id: 32, name: "Napoleon Torti", price: 22000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1464305795204-6f5bbfc7fb81?w=500&q=80" },
      { id: 33, name: "Nisholda", price: 14000, category: "Shirinliklar", image: "https://images.unsplash.com/photo-1587314168485-3236d6710814?w=500&q=80" }
    ];

    function App() {
      const [cart, setCart] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState("Barchasi");
      const [orderCompleted, setOrderCompleted] = useState(null);
      const [tableNumber, setTableNumber] = useState(1);

      useEffect(() => {
        const queryParams = new URLSearchParams(window.location.search);
        const tableFromUrl = queryParams.get("table");
        if (tableFromUrl) {
          setTableNumber(tableFromUrl);
        }
      }, []);

      function addToCart(food) {
        const existing = cart.find(item => item.id === food.id);
        if (existing) {
          setCart(cart.map(item => item.id === food.id ? { ...item, quantity: item.quantity + 1 } : item));
        } else {
          setCart([...cart, { ...food, quantity: 1 }]);
        }
      }

      function changeQuantity(id, delta) {
        setCart(cart.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      }

      const filteredFoods = selectedCategory === "Barchasi" 
        ? menuItems 
        : menuItems.filter(f => f.category === selectedCategory);

      const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

      function handleCheckout() {
        if (cart.length === 0) return;
        const newOrder = {
          id: Math.floor(100000 + Math.random() * 900000),
          table: tableNumber,
          items: [...cart],
          totalPrice: total,
          date: new Date().toLocaleTimeString()
        };
        setOrderCompleted(newOrder);
        setCart([]);
      }

      return (
        <div className="container">
          <style>{`
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
            body { background-color: #f8f9fa; color: #333; padding: 20px; }
            .container { max-width: 1100px; margin: 0 auto; }
            .header { text-align: center; margin-bottom: 20px; }
            .header h1 { color: #ff4757; }
            .table-badge { background: #ff4757; color: white; display: inline-block; padding: 5px 15px; border-radius: 15px; font-weight: bold; margin-top: 8px; font-size: 0.9rem; }
            .categories { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; flex-wrap: wrap; }
            .cat-btn { padding: 8px 16px; border: none; border-radius: 20px; background: #fff; cursor: pointer; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s; }
            .cat-btn.active, .cat-btn:hover { background: #ff4757; color: #fff; }
            .main-content { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
            @media(max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
            .foods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
            .food-card { background: #fff; padding: 12px; border-radius: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
            .food-img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
            .food-card h3 { font-size: 1rem; margin-bottom: 5px; }
            .price { color: #2ed573; font-weight: bold; margin: 4px 0 8px 0; }
            .order-btn { background: #ff4757; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
            .order-btn:hover { background: #ff334b; }
            .cart-section { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); height: fit-content; position: sticky; top: 20px; }
            .cart-section h2 { margin-bottom: 12px; font-size: 1.2rem; }
            .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9rem; border-bottom: 1px solid #eee; padding-bottom: 6px; }
            .qty-box { display: flex; gap: 6px; align-items: center; }
            .qty-box button { width: 24px; height: 24px; border: none; background: #ddd; cursor: pointer; font-weight: bold; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
            .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin: 15px 0; border-top: 2px dashed #ddd; padding-top: 10px; }
            .checkout-btn { width: 100%; background: #2ed573; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
            .checkout-btn:hover { background: #26af5f; }
            .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
            .receipt-modal { background: white; padding: 25px; border-radius: 10px; width: 320px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
            .receipt-modal h2 { color: #2ed573; margin-bottom: 10px; }
            .receipt-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 5px; }
            .close-btn { width: 100%; background: #333; color: white; border: none; padding: 8px; border-radius: 5px; margin-top: 15px; cursor: pointer; }
          `}</style>

          <div className="header">
            <h1>🍽️ Mazali Restoran</h1>
            <div className="table-badge">📍 Stol № {tableNumber}</div>
          </div>

          <div className="categories">
            {["Barchasi", "Ovqatlar", "Salatlar", "Ichimliklar", "Shirinliklar"].map(cat => (
              <button 
                key={cat} 
                className={`cat-btn ${selectedCategory === cat ? 'active' : ''}`}
                onClick={() => setSelectedCategory(cat)}
              >
                {cat}
              </button>
            ))}
          </div>

          <div className="main-content">
            <div className="menu-section">
              <div className="foods-grid">
                {filteredFoods.map((food) => (
                  <div className="food-card" key={food.id}>
                    <div>
                      <img src={food.image} alt={food.name} className="food-img" />
                      <h3>{food.name}</h3>
                    </div>
                    <div>
                      <p className="price">{food.price.toLocaleString()} so'm</p>
                      <button className="order-btn" onClick={() => addToCart(food)}>+ Qo'shish</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="cart-section">
              <h2>🛒 Savatcha</h2>
              {cart.length === 0 ? (
                <p style={{color: '#888', textAlign: 'center', margin: '20px 0'}}>Bo'sh</p>
              ) : (
                <div>
                  {cart.map(item => (
                    <div className="cart-item" key={item.id}>
                      <div>
                        <strong>{item.name}</strong>
                        <div style={{fontSize: '0.8rem', color: '#666'}}>{item.price.toLocaleString()} so'm</div>
                      </div>
                      <div className="qty-box">
                        <button onClick={() => changeQuantity(item.id, -1)}>-</button>
                        <span>{item.quantity}</span>
                        <button onClick={() => changeQuantity(item.id, 1)}>+</button>
                      </div>
                    </div>
                  ))}
                  <div className="cart-total">
                    <span>Jami:</span>
                    <span style={{color: '#2ed573'}}>{total.toLocaleString()} so'm</span>
                  </div>
                  <button className="checkout-btn" onClick={handleCheckout}>Buyurtma berish</button>
                </div>
              )}
            </div>
          </div>

          {orderCompleted && (
            <div className="modal-overlay">
              <div className="receipt-modal">
                <h2>📜 Restoran Cheki</h2>
                <p style={{fontSize: '0.85rem', color: '#666'}}>Buyurtma №: #{orderCompleted.id}</p>
                <p style={{fontSize: '0.85rem', color: '#ff4757', fontWeight: 'bold', margin: '5px 0'}}>Stol: № {orderCompleted.table}</p>
                <p style={{fontSize: '0.85rem', color: '#666', marginBottom: '15px'}}>Vaqti: {orderCompleted.date}</p>
                <hr style={{border: '1px dashed #ddd', marginBottom: '10px'}} />
                {orderCompleted.items.map(i => (
                  <div className="receipt-row" key={i.id}>
                    <span>{i.name} (x{i.quantity})</span>
                    <span>{(i.price * i.quantity).toLocaleString()} so'm</span>
                  </div>
                ))}
                <hr style={{border: '1px dashed #ddd', margin: '10px 0'}} />
                <div style={{display: 'flex', justifyContent: 'space-between', fontWeight: 'bold', marginBottom: '15px'}}>
                  <span>Jami to'lov:</span>
                  <span style={{color: '#2ed573'}}>{orderCompleted.totalPrice.toLocaleString()} so'm</span>
                </div>
                <button className="close-btn" onClick={() => setOrderCompleted(null)}>Yopish</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Ilovani ekranga chiqarish
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
